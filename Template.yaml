AWSTemplateFormatVersion: 2010-09-09
Description: CloudFormation Template for WebServer with Security Group and EC2 Instance

Parameters:
  ExistingInstanceProfileName:
    Description: Name of an existing IAM instance profile with access to read the website bucket
    Type: String
    Default: LabInstanceProfile
    MinLength: 1
    MaxLength: 128
    AllowedPattern: '^[A-Za-z0-9_+=,.@-]+$'
    ConstraintDescription: Enter a valid IAM instance profile name, not an ARN.
  LatestAmiId:
    Description: Latest Amazon Linux 2023 x86-64 AMI from AWS Systems Manager Parameter Store
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64'

  InstanceType:
    Description: WebServer EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    ConstraintDescription: must be a valid EC2 instance type.
    
  MyIP:
    Description: Your IP address in CIDR format (e.g. 203.0.113.1/32).
    Type: String
    MinLength: '9'
    MaxLength: '18'
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: must be a valid IP CIDR range of the form x.x.x.x/x.

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt WebsiteBucket.Arn
              - !Sub '${WebsiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: 'false'
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access via my IP address
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MyIP
  WebsiteServer:
    Type: AWS::EC2::Instance
    Properties:
      IamInstanceProfile: !Ref ExistingInstanceProfileName
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            Encrypted: true
            VolumeType: gp3
            VolumeSize: 8
            DeleteOnTermination: true
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y httpd awscli2

          # Download safely: replace the live page only after a successful transfer.
          cat > /usr/local/bin/update-website <<'SCRIPT'
          #!/bin/bash
          set -euo pipefail
          temp_file=$(mktemp /var/www/html/.index.XXXXXX)
          trap 'rm -f "$temp_file"' EXIT

          aws s3 cp 's3://${WebsiteBucket}/index.html' "$temp_file" \
            --region '${AWS::Region}' --only-show-errors
          test -s "$temp_file"
          chmod 644 "$temp_file"
          mv -f "$temp_file" /var/www/html/index.html
          systemctl enable --now httpd
          SCRIPT
          chmod 755 /usr/local/bin/update-website

          cat > /etc/systemd/system/website-update.service <<'SERVICE'
          [Unit]
          Description=Download the website page from S3
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/update-website
          SERVICE

          # Retry failed downloads and pick up subsequent content updates.
          cat > /etc/systemd/system/website-update.timer <<'TIMER'
          [Unit]
          Description=Check S3 for website content every minute

          [Timer]
          OnBootSec=30s
          OnUnitInactiveSec=60s
          Unit=website-update.service

          [Install]
          WantedBy=timers.target
          TIMER

          systemctl daemon-reload
          systemctl enable --now website-update.timer

Outputs:
  WebsiteBucketName:
    Description: Name of the bucket storing website files
    Value: !Ref WebsiteBucket
  WebsiteURL:
    Value: !Join
      - ''
      - - http://
        - !GetAtt WebsiteServer.PublicDnsName
    Description: Website URL